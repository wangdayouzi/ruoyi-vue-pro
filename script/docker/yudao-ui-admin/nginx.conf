server {
    listen       80;
    server_name  cms.accurantbio.com;
    return 301 https://$host$request_uri;
}

# IP 访问（无 SSL）
server {
    listen       80 default_server;
    server_name  _;

    client_max_body_size 20m;
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    root   /usr/share/nginx/html;
    index  index.html;

    location / { try_files $uri $uri/ /index.html; }
    location ^~ /h5/ { alias /usr/share/nginx/h5/; index index.html; try_files $uri $uri/ /h5/index.html; }
    location /admin-api/ { proxy_pass http://yudao-server:48080/admin-api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /ws/ { proxy_pass http://yudao-server:48080/ws/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ { expires 30d; add_header Cache-Control "public, immutable"; }
}

server {
    listen       443 ssl;
    http2        on;
    server_name  cms.accurantbio.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 上传文件大小限制
    client_max_body_size 20m;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # 静态资源根目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 前端路由 history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 手机端 H5
    location ^~ /h5/ {
        alias /usr/share/nginx/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # 后端 API 代理
    location /admin-api/ {
        proxy_pass http://yudao-server:48080/admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 代理（IM 等模块需要）
    location /ws/ {
        proxy_pass http://yudao-server:48080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
