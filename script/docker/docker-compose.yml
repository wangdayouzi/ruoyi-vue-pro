version: "3.4"

name: yudao-system

services:
  redis:
    container_name: yudao-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - ./redis/data:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDISCLI_AUTH} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  onlyoffice:
    container_name: yudao-onlyoffice
    image: onlyoffice/documentserver:8.3
    restart: unless-stopped
    ports:
      - "8088:443"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-yudao-onlyoffice-secret}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      SSL_CERTIFICATE_PATH: /etc/ssl/certs/onlyoffice.crt
      SSL_KEY_PATH: /etc/ssl/private/onlyoffice.key
    volumes:
      - ./onlyoffice/data:/var/www/onlyoffice/Data
      - ./onlyoffice/log:/var/log/onlyoffice
      - ./onlyoffice/fonts:/usr/share/fonts
      - /home/ssl/cms/cert.pem:/etc/ssl/certs/onlyoffice.crt:ro
      - /home/ssl/cms/key.pem:/etc/ssl/private/onlyoffice.key:ro

  server:
    container_name: yudao-server
    image: eclipse-temurin:17-jre
    restart: unless-stopped
    ports:
      - "48080:48080"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2048m -Dspring.profiles.active=prod -Duser.timezone=Asia/Shanghai -Djava.security.egd=file:/dev/./urandom -XX:+UseG1GC}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-yudao}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      PM_DB_HOST: ${PM_DB_HOST:-172.16.200.200}
      PM_DB_PORT: ${PM_DB_PORT:-1433}
      PM_DB_NAME: ${PM_DB_NAME:-SHJH_Prj}
      PM_DB_USERNAME: ${PM_DB_USERNAME:-sa}
      PM_DB_PASSWORD: ${PM_DB_PASSWORD:-Aa123456}
      STG_PM_DB_HOST: ${STG_PM_DB_HOST:-host.docker.internal}
      STG_PM_DB_PORT: ${STG_PM_DB_PORT:-5432}
      STG_PM_DB_NAME: ${STG_PM_DB_NAME:-yudao_stg_pm}
      STG_PM_DB_USERNAME: ${STG_PM_DB_USERNAME:-postgres}
      STG_PM_DB_PASSWORD: ${STG_PM_DB_PASSWORD:-postgres}
      REDIS_HOST: ${REDIS_HOST:-yudao-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ONLYOFFICE_DOC_URL: ${ONLYOFFICE_DOC_URL:-http://yudao-onlyoffice}
      ONLYOFFICE_CALLBACK_URL: ${ONLYOFFICE_CALLBACK_URL:-http://yudao-server:48080/admin-api/amf/onlyoffice/callback}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-yudao-onlyoffice-secret}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH:-/data/yudao/uploadfile}
    volumes:
      - ./yudao-server/yudao-server.jar:/app.jar:ro
      - ./uploadfile:/data/yudao/uploadfile
      - ./logs/server:/root/logs
    command: java ${JAVA_OPTS} -jar /app.jar
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  admin:
    container_name: yudao-admin
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./yudao-ui-admin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./yudao-ui-admin/dist:/usr/share/nginx/html:ro
      - ./yudao-ui-uniapp/dist/build/h5:/usr/share/nginx/h5:ro
      - /home/ssl/cms:/etc/nginx/ssl:ro
    depends_on:
      - server



