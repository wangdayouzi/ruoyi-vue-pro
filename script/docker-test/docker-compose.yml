version: "3.4"

# ============================================================
# yudao 测试环境（同一台服务器，与生产完全隔离）
#   服务器目录:  /home/yudao-test/
#   端口:        后端 48081 / 前端 8081 / Redis 16380
#   数据库:      宿主机 PostgreSQL，库名 yudao_test（手动从生产导入）
#   容器/项目名:  带 -test 后缀，与生产 (yudao-system) 不冲突
#   钉钉登录独立回调；OnlyOffice 独立测试容器；不启动 Stream、不跑老ERP同步
# ============================================================

name: yudao-test-system

services:
  redis:
    container_name: yudao-test-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "16380:6379"          # 测试 Redis，避免与生产 16379 冲突
    volumes:
      - ./redis/data:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDISCLI_AUTH} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 测试独立文档服务，仅在 Compose 网络内提供 HTTP，由 admin 统一终止 TLS。
  onlyoffice:
    container_name: yudao-test-onlyoffice
    image: onlyoffice/documentserver:9.4.0.1
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?请在测试 .env 设置独立的 ONLYOFFICE_JWT_SECRET}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - ./onlyoffice/data:/var/www/onlyoffice/Data
      - ./onlyoffice/log:/var/log/onlyoffice
      - ./onlyoffice/fonts:/usr/share/fonts

  server:
    container_name: yudao-test-server
    image: eclipse-temurin:17-jre
    restart: unless-stopped
    ports:
      - "48081:48080"         # 测试后端，避免与生产 48080 冲突
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -Dspring.profiles.active=prod -Duser.timezone=Asia/Shanghai -Djava.security.egd=file:/dev/./urandom -XX:+UseG1GC}
      DB_HOST: ${DB_HOST:-172.17.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-yudao_test}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # 从库：测试直连 yudao_test（避免生产默认 127.0.0.1 指到容器内部）
      SLAVE_DB_HOST: ${SLAVE_DB_HOST:-172.17.0.1}
      SLAVE_DB_PORT: ${SLAVE_DB_PORT:-5432}
      SLAVE_DB_NAME: ${SLAVE_DB_NAME:-yudao_test}
      SLAVE_DB_USERNAME: ${SLAVE_DB_USERNAME:-postgres}
      SLAVE_DB_PASSWORD: ${SLAVE_DB_PASSWORD:-postgres}
      # 老ERP SQL Server（测试不接，lazy 数据源不影响启动；需要同步时再打开）
      PM_DB_HOST: ${PM_DB_HOST:-172.16.200.200}
      PM_DB_PORT: ${PM_DB_PORT:-1433}
      PM_DB_NAME: ${PM_DB_NAME:-SHJH_Prj}
      PM_DB_USERNAME: ${PM_DB_USERNAME:-sa}
      PM_DB_PASSWORD: ${PM_DB_PASSWORD:-Aa123456}
      # 老ERP staging（测试不跑同步，指向空库 yudao_stg_pm_test 即可）
      STG_PM_DB_HOST: ${STG_PM_DB_HOST:-172.17.0.1}
      STG_PM_DB_PORT: ${STG_PM_DB_PORT:-5432}
      STG_PM_DB_NAME: ${STG_PM_DB_NAME:-yudao_stg_pm_test}
      STG_PM_DB_USERNAME: ${STG_PM_DB_USERNAME:-postgres}
      STG_PM_DB_PASSWORD: ${STG_PM_DB_PASSWORD:-postgres}
      # 老样本系统 MySQL（临床方案/项目号同步源，只读）
      YANGBEN_DB_HOST: ${YANGBEN_DB_HOST:-192.168.10.236}
      YANGBEN_DB_PORT: ${YANGBEN_DB_PORT:-3306}
      YANGBEN_DB_NAME: ${YANGBEN_DB_NAME:-yangben_com}
      YANGBEN_DB_USERNAME: ${YANGBEN_DB_USERNAME:-yangben_com}
      YANGBEN_DB_PASSWORD: ${YANGBEN_DB_PASSWORD:-Dt6cz5r2FtaMFSMN}
      REDIS_HOST: ${REDIS_HOST:-yudao-test-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 测试登录回调独立；消息发送可单独开启，Stream 默认关闭
      DINGTALK_OAUTH2_REDIRECT_URI: ${DINGTALK_OAUTH2_REDIRECT_URI:-https://cms.accurantbio.com:8081/admin-api/system/auth/dingtalk/callback}
      DINGTALK_OAUTH2_FRONTEND_URL: ${DINGTALK_OAUTH2_FRONTEND_URL:-https://cms.accurantbio.com:8081}
      DINGTALK_INTEGRATION_ENABLED: ${DINGTALK_INTEGRATION_ENABLED:-false}
      DINGTALK_STREAM_ENABLED: ${DINGTALK_STREAM_ENABLED:-false}
      # OnlyOffice 浏览器入口走测试 Nginx，下载与回调走测试容器内网
      ONLYOFFICE_DOC_URL: ${ONLYOFFICE_DOC_URL:-https://cms.accurantbio.com:8081/onlyoffice}
      ONLYOFFICE_CALLBACK_URL: ${ONLYOFFICE_CALLBACK_URL:-http://yudao-test-server:48080/admin-api/amf/onlyoffice/callback}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?请在测试 .env 设置独立的 ONLYOFFICE_JWT_SECRET}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH:-/data/yudao/uploadfile}
    volumes:
      - ./yudao-server/yudao-server.jar:/app.jar:ro
      - ./uploadfile:/data/yudao/uploadfile
      - ./logs/server:/root/logs
    command: java ${JAVA_OPTS} -jar /app.jar
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  admin:
    container_name: yudao-test-admin
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8081:443"            # 测试 HTTPS 入口，与正式端口隔离
    volumes:
      - /home/ssl/cms:/etc/nginx/ssl:ro
      - ./yudao-ui-admin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./yudao-ui-admin/dist:/usr/share/nginx/html:ro
      - ./yudao-ui-uniapp/dist/build/h5:/usr/share/nginx/h5:ro
    depends_on:
      - server
      - onlyoffice
