server {
    listen       443 ssl;
    http2        on;
    server_name  cms.accurantbio.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传文件大小限制
    client_max_body_size 100m;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # 静态资源根目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 独立测试 OnlyOffice；^~ 防止脚本和字体被下面的静态缓存规则截获。
    location = /onlyoffice {
        return 301 https://$http_host/onlyoffice/;
    }
    location ^~ /onlyoffice/ {
        proxy_pass http://yudao-test-onlyoffice/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 手机端 H5
    location ^~ /h5/ {
        alias /usr/share/nginx/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # 前端路由 history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理（测试后端容器 yudao-test-server，内部端口 48080）
    location ^~ /admin-api/ {
        proxy_pass http://yudao-test-server:48080/admin-api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 代理（IM 等模块需要）
    location /ws/ {
        proxy_pass http://yudao-test-server:48080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
