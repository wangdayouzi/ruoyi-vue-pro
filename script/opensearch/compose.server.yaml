name: yudao-opensearch-server

services:
  certificates:
    image: alpine/openssl:3.5.4
    user: "0:0"
    restart: "no"
    network_mode: none
    environment:
      OPENSEARCH_PRIVATE_IP: ${OPENSEARCH_PRIVATE_IP:-}
    entrypoint: ["/bin/sh", "/certificates.sh"]
    configs:
      - source: certificates_script
        target: /certificates.sh
    volumes:
      - "${OPENSEARCH_DATA_DIR:-/home/opensearch/data}:/data"
      - "${OPENSEARCH_CERT_DIR:-/home/opensearch/certs}:/certs"
      - "${OPENSEARCH_BOOTSTRAP_DIR:-/home/opensearch/security-bootstrap}:/private"
      - public_ca:/public-ca

  certificate-renewer:
    image: alpine/openssl:3.5.4
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    depends_on:
      certificates:
        condition: service_completed_successfully
    environment:
      OPENSEARCH_PRIVATE_IP: ${OPENSEARCH_PRIVATE_IP:-}
    entrypoint: ["/bin/sh", "/certificates.sh", "watch"]
    configs:
      - source: certificates_script
        target: /certificates.sh
    volumes:
      - "${OPENSEARCH_CERT_DIR:-/home/opensearch/certs}:/certs"
      - "${OPENSEARCH_BOOTSTRAP_DIR:-/home/opensearch/security-bootstrap}:/private"
    healthcheck:
      # 续签失败、检查任务停止或 CA 临近到期时标为 unhealthy。
      test: ["CMD", "sh", "/certificates.sh", "health"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 30s

  opensearch:
    image: yudao-opensearch:3.9.0-icu
    pull_policy: never
    build:
      # 空目录作为构建上下文，避免把数据、证书和环境文件送入构建。
      context: ./build-context
      dockerfile_inline: |
        FROM opensearchproject/opensearch:3.9.0
        RUN /usr/share/opensearch/bin/opensearch-plugin install --batch analysis-icu
    entrypoint:
      - /bin/bash
      - -ec
      - |
        if ! test -s config/opensearch-security/internal_users.yml; then
          echo "Missing security configuration. Run the bootstrap service manually first." >&2
          exit 1
        fi
        exec ./opensearch-docker-entrypoint.sh "$$@"
      - --
    command: ["opensearch"]
    depends_on:
      certificates:
        condition: service_completed_successfully
    # 服务器或 Docker 重启后恢复主服务，手动停止后保持停止。
    restart: unless-stopped
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_HEAP:-2g} -Xmx${OPENSEARCH_HEAP:-2g}"
    # 同机部署的起步资源。上限须为堆外内存和文件缓存留空间。
    mem_limit: ${OPENSEARCH_MEMORY_LIMIT:-5g}
    cpus: ${OPENSEARCH_CPUS:-4}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # 初始化容器准备目录权限。建议把索引挂到容量较大的 SSD 分区。
      - type: bind
        source: ${OPENSEARCH_DATA_DIR:-/home/opensearch/data}
        target: /usr/share/opensearch/data
      - type: bind
        source: ${OPENSEARCH_CERT_DIR:-/home/opensearch/certs}
        target: /usr/share/opensearch/config/certs
        read_only: true
      - type: volume
        source: security_config
        target: /usr/share/opensearch/config/opensearch-security
        read_only: true
        volume:
          nocopy: true
    configs:
      - source: opensearch_config
        target: /usr/share/opensearch/config/opensearch.yml
    # 专用内网由本 Compose 创建，供 Yudao 后端加入。
    networks:
      - search
    healthcheck:
      # 只有 Security 初始化完成后，匿名请求才应返回 401。
      test: ["CMD-SHELL", "code=$$(curl -sS --max-time 4 --cacert config/certs/ca.pem --resolve opensearch:9200:127.0.0.1 -o /dev/null -w '%{http_code}' https://opensearch:9200/) && [ \"$$code\" = 401 ]"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    profiles: ["dashboards"]
    restart: "no"
    environment:
      OPENSEARCH_PASSWORD: ${OPENSEARCH_DASHBOARDS_PASSWORD:?Set the kibanaserver password}
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "${OPENSEARCH_DASHBOARDS_BIND_IP:-127.0.0.1}:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    volumes:
      - public_ca:/usr/share/opensearch-dashboards/config/search-certs:ro
    configs:
      - source: dashboards_config
        target: /usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
    networks:
      - search
      - dashboards_ui

  bootstrap:
    image: yudao-opensearch:3.9.0-icu
    pull_policy: never
    profiles: ["bootstrap"]
    user: "0:0"
    restart: "no"
    network_mode: none
    environment:
      OPENSEARCH_PMS_PASSWORD: ${OPENSEARCH_PMS_PASSWORD:?Set the pms_search password}
      OPENSEARCH_DASHBOARDS_PASSWORD: ${OPENSEARCH_DASHBOARDS_PASSWORD:?Set the kibanaserver password}
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    configs:
      - source: bootstrap_script
        target: /bootstrap.sh
    volumes:
      - security_config:/security-config

  admin-account:
    image: yudao-opensearch:3.9.0-icu
    pull_policy: never
    profiles: ["admin-account"]
    user: "0:0"
    environment:
      OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-}
    entrypoint: ["/bin/bash", "/admin-account.sh"]
    configs:
      - source: admin_account_script
        target: /admin-account.sh
    volumes:
      - "${OPENSEARCH_CERT_DIR:-/home/opensearch/certs}/ca.pem:/ca.pem:ro"
      - "${OPENSEARCH_BOOTSTRAP_DIR:-/home/opensearch/security-bootstrap}/admin.pem:/admin.pem:ro"
      - "${OPENSEARCH_BOOTSTRAP_DIR:-/home/opensearch/security-bootstrap}/admin-key.pem:/admin-key.pem:ro"
    networks:
      - search

networks:
  search:
    internal: true
    name: ${OPENSEARCH_NETWORK:-yudao-search}
  dashboards_ui:
    driver: bridge

volumes:
  security_config:
  public_ca:

configs:
  bootstrap_script:
    file: ./scripts/bootstrap.sh

  admin_account_script:
    file: ./scripts/admin-account.sh

  certificates_script:
    file: ./scripts/certificates.sh

  opensearch_config:
    content: |
      cluster.name: yudao-search
      node.name: opensearch
      network.host: 0.0.0.0
      discovery.type: single-node
      plugins.security.allow_default_init_securityindex: true
      # 续签复用原私钥并原子替换 PEM，节点会自动读取更新后的证书。
      plugins.security.ssl.certificates_hot_reload.enabled: true
      plugins.security.ssl.transport.pemcert_filepath: certs/node.pem
      plugins.security.ssl.transport.pemkey_filepath: certs/node-key.pem
      plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.pem
      plugins.security.ssl.http.enabled: true
      plugins.security.ssl.http.clientauth_mode: OPTIONAL
      plugins.security.ssl.http.pemcert_filepath: certs/node.pem
      plugins.security.ssl.http.pemkey_filepath: certs/node-key.pem
      plugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.pem
      plugins.security.nodes_dn:
        - 'CN=opensearch'
      plugins.security.authcz.admin_dn:
        - 'CN=opensearch-security-admin'
      plugins.security.restapi.roles_enabled: ["all_access"]
  dashboards_config:
    content: |
      server.host: "0.0.0.0"
      opensearch.hosts: ["https://opensearch:9200"]
      opensearch.username: kibanaserver
      opensearch.ssl.verificationMode: full
      opensearch.ssl.certificateAuthorities: ["/usr/share/opensearch-dashboards/config/search-certs/ca.pem"]
      opensearch.requestHeadersAllowlist: ["authorization", "securitytenant"]
      opensearch_security.multitenancy.enabled: true
      opensearch_security.cookie.secure: false
