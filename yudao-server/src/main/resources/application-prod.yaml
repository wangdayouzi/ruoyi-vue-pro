server:
  port: 48080

--- #################### 数据库相关配置 ####################
spring:
  autoconfigure:
    # noinspection SpringBootApplicationYaml
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration # 禁用 AI 模块的 Qdrant，手动创建
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration # 禁用 AI 模块的 Milvus，手动创建
  # 数据源配置项
  datasource:
    druid: # Druid 【监控】相关的全局配置
      web-stat-filter:
        enabled: false # 生产环境关闭 Druid 监控页面
      stat-view-servlet:
        enabled: false # 生产环境关闭 Druid 控制台
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 慢 SQL 记录
          slow-sql-millis: 1000 # 生产环境慢 SQL 阈值调高
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic: # 多数据源配置
      druid: # Druid 【连接池】相关的全局配置
        initial-size: 5 # 初始连接数
        min-idle: 5 # 最小连接池数量
        max-active: 50 # 最大连接池数量（生产环境调大）
        max-wait: 60000 # 配置获取连接等待超时的时间，单位：毫秒（1 分钟）
        time-between-eviction-runs-millis: 60000 # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位：毫秒
        min-evictable-idle-time-millis: 600000 # 配置一个连接在池中最小生存的时间，单位：毫秒（10 分钟）
        max-evictable-idle-time-millis: 1800000 # 配置一个连接在池中最大生存的时间，单位：毫秒（30 分钟）
        validation-query: SELECT 1 # 配置检测连接是否有效
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true # 是否开启 PreparedStatement 缓存
        max-pool-prepared-statement-per-connection-size: 20 # 每个连接缓存的 PreparedStatement 数量
      primary: master
      datasource:
        master:
          # 生产环境使用 PostgreSQL，连接 Linux 服务器上的数据库
          # 部署时通过环境变量或启动参数覆盖以下配置
          url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:yudao}?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai&currentSchema=mes,public
          username: ${DB_USERNAME:postgres}
          password: ${DB_PASSWORD:postgres}
        slave: # 从库，可根据自己需要修改
          lazy: true # 开启懒加载，保证启动速度
          url: jdbc:postgresql://${SLAVE_DB_HOST:127.0.0.1}:${SLAVE_DB_PORT:5432}/${SLAVE_DB_NAME:yudao}?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
          username: ${SLAVE_DB_USERNAME:postgres}
          password: ${SLAVE_DB_PASSWORD:postgres}
        sqlserver: # 试剂标签打印 - 只读 SQL Server 数据源（按 BASID 查询）
          lazy: true # 开启懒加载，保证启动速度
          url: jdbc:sqlserver://${PM_DB_HOST:172.16.200.200}:${PM_DB_PORT:1433};DatabaseName=${PM_DB_NAME:SHJH_Prj};encrypt=false;trustServerCertificate=true
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          username: ${PM_DB_USERNAME:sa}
          password: ${PM_DB_PASSWORD:Aa123456}
          druid:
            validation-query: SELECT 1 # SQL Server 不支持 SELECT 1 FROM DUAL，单独覆盖
        stgpm: # 老ERP同步 - staging 中间库（独立 PostgreSQL）
          lazy: true # 开启懒加载，保证启动速度
          url: jdbc:postgresql://${STG_PM_DB_HOST:127.0.0.1}:${STG_PM_DB_PORT:5432}/${STG_PM_DB_NAME:yudao_stg_pm}?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true
          driver-class-name: org.postgresql.Driver
          username: ${STG_PM_DB_USERNAME:postgres}
          password: ${STG_PM_DB_PASSWORD:postgres}
          druid:
            validation-query: SELECT 1

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:yudao-redis} # 地址，Docker 部署默认使用容器名
      port: ${REDIS_PORT:6379} # 端口
      database: ${REDIS_DB:0} # 数据库索引
      password: ${REDIS_PASSWORD:} # 密码，建议生产环境开启

--- #################### 定时任务相关配置 ####################

spring:
  quartz:
    auto-startup: true # 生产环境开启定时任务
    scheduler-name: schedulerName
    job-store-type: jdbc
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: schedulerName
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            isClustered: true
            clusterCheckinInterval: 15000
            misfireThreshold: 60000
          threadPool:
            threadCount: 25
            threadPriority: 5
            class: org.quartz.simpl.SimpleThreadPool
    jdbc:
      initialize-schema: NEVER

--- #################### 消息队列相关 ####################

# rocketmq 配置项，对应 RocketMQProperties 配置类
rocketmq:
  name-server: 127.0.0.1:9876 # RocketMQ Namesrv

spring:
  # RabbitMQ 配置项，对应 RabbitProperties 配置类
  rabbitmq:
    host: 127.0.0.1 # RabbitMQ 服务的地址
    port: 5672 # RabbitMQ 服务的端口
    username: rabbit # RabbitMQ 服务的账号
    password: rabbit # RabbitMQ 服务的密码
  # Kafka 配置项，对应 KafkaProperties 配置类
  kafka:
    bootstrap-servers: 127.0.0.1:9092 # 指定 Kafka Broker 地址，可以设置多个，以逗号分隔

--- #################### 服务保障相关配置 ####################

lock4j:
  acquire-timeout: 3000
  expire: 30000

--- #################### 监控相关配置 ####################

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: 'health,info,metrics' # 生产环境只暴露必要的端点

spring:
  boot:
    admin:
      client:
        url: http://127.0.0.1:${server.port}/${spring.boot.admin.context-path}
        instance:
          service-host-type: IP
        username: ${ADMIN_USERNAME:admin}
        password: ${ADMIN_PASSWORD:admin}
      context-path: /admin
      frame-ancestors: "'self'"

--- #################### 日志文件配置 ####################

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log
  level:
    root: INFO # 生产环境只打印 INFO 及以上级别
    cn.iocoder.yudao: INFO
    # 关键模块可开启 DEBUG 排查问题
    # cn.iocoder.yudao.module.amf.dal.mysql: DEBUG

--- #################### 分析方法文件管理（AMF）相关配置 ####################

yudao:
  amf:
    file-storage-path: ${FILE_STORAGE_PATH:/data/yudao/uploadfile} # 文件本地存储路径（生产环境建议挂载卷）

# OnlyOffice 相关配置
onlyoffice:
  doc-server-url: ${ONLYOFFICE_DOC_URL:http://yudao-onlyoffice} # OnlyOffice Document Server 地址
  callback-url: ${ONLYOFFICE_CALLBACK_URL:http://yudao-server:48080/admin-api/amf/onlyoffice/callback} # 回调地址
  jwt-secret: ${ONLYOFFICE_JWT_SECRET:} # JWT 密钥（与 OnlyOffice 容器 JWT_SECRET 一致）

